name: vr-build

# Single source of truth for verification. Everything is compiled on GitHub; the local
# workstation has no Android SDK / Gradle / JDK 17.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Google Cardboard SDK v1.36.0 has no Maven artifact. Build the AAR once from the vendored
  # upstream sources and hand it to the app job as an artifact. This is a SEPARATE Gradle build
  # (AGP 9.2.0 / Gradle 9.8.0) from the host app (AGP 9.4.0 / Gradle 9.8.2).
  cardboard-aar:
    name: build-cardboard-sdk-aar
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: third_party/cardboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages for the Cardboard build
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK at: $SDK"
          SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
          echo "sdk.dir=$SDK" > local.properties

      # The wrapper downloads gradle-9.8.0-bin.zip on every fresh runner. GitHub's egress to
      # services.gradle.org occasionally times out mid-download and the whole job goes red for
      # a reason unrelated to the code. Warm (and cache) the distribution with retries first.
      - name: Warm the Gradle distribution (retry transient download timeouts)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3 4 5; do
            echo "Gradle distribution warm-up attempt ${attempt}/5"
            if ./gradlew --version; then
              echo "Gradle distribution ready"
              exit 0
            fi
            echo "Warm-up attempt ${attempt} failed; retrying" >&2
            sleep 10
          done
          echo "FAIL: Gradle distribution could not be downloaded after 5 attempts" >&2
          exit 1

      - name: Build sdk-debug.aar (assembleDebug, NOT release)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export CMAKE="$SDK/cmake/3.31.6/bin/cmake"
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          # The SDK's release build type has minifyEnabled true and would obfuscate its public API.
          ./gradlew --no-daemon --no-configuration-cache :sdk:assembleDebug
          ls -la sdk/build/outputs/aar/

      # Regression guard for the VR entry crash: Initialize.java loads "cardboard_sdk_jni".
      # If that .so is missing from the AAR, tapping "enter VR" dies with UnsatisfiedLinkError
      # on the device even though compilation and JVM tests are green.
      - name: Verify the Cardboard JNI bridge is in the AAR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, zipfile
          aars = sorted(glob.glob('sdk/build/outputs/aar/*.aar'))
          print('AARs:', aars)
          found = False
          for path in aars:
              with zipfile.ZipFile(path) as z:
                  jni = sorted(n for n in z.namelist() if n.startswith('jni/') and n.endswith('.so'))
              print(path, 'jni libs:', jni)
              if any(n.endswith('/libcardboard_sdk_jni.so') for n in jni):
                  found = True
          if not found:
              sys.exit('FAIL: libcardboard_sdk_jni.so missing from AAR - VR entry will crash')
          PY

      - name: Upload the AAR
        uses: actions/upload-artifact@v4
        with:
          name: cardboard-sdk-aar
          path: third_party/cardboard/sdk/build/outputs/aar/sdk-debug.aar
          if-no-files-found: error

  app:
    # Builds BOTH build types. The signed, R8-minified, non-debuggable release APK is the
    # artifact published as an official (Stable) version; the debug APK stays as a diagnostic
    # fallback. See docs/HANDOFF.md section 26.
    name: vr-unit-tests-and-release-apk
    needs: cardboard-aar
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    env:
      # Controls both Gradle abiFilters and the Rust NVST target list (build_nvst.py).
      OPENNOW_ABIS: arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust (single Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK at: $SDK"
          SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "platforms;android-37.1" "platforms;android-37.2" "build-tools;37.0.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
          echo "sdk.dir=$SDK" > local.properties

      - name: Download the Cardboard SDK AAR
        uses: actions/download-artifact@v4
        with:
          name: cardboard-sdk-aar
          path: android/app/libs

      - name: Normalize the AAR filename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          mv -v app/libs/sdk-debug.aar app/libs/cardboard-sdk.aar
          ls -la app/libs

      # Same transient-download guard as the SDK job, but for the host app's gradle-9.8.2 dist.
      - name: Warm the Gradle distribution (retry transient download timeouts)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3 4 5; do
            echo "Gradle distribution warm-up attempt ${attempt}/5"
            if ./gradlew --version; then
              echo "Gradle distribution ready"
              exit 0
            fi
            echo "Warm-up attempt ${attempt} failed; retrying" >&2
            sleep 10
          done
          echo "FAIL: Gradle distribution could not be downloaded after 5 attempts" >&2
          exit 1

      - name: Run VR JVM unit tests and build the debug + signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export CMAKE="$SDK/cmake/3.31.6/bin/cmake"
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          # assembleRelease is the OFFICIAL build: signed with signingConfigs.release, R8 minify +
          # resource shrink, android:debuggable=false. proguard-rules.pro keeps the Cardboard JNI
          # surface and the VR enums that VrSettingsStore persists by name.
          # Scope the JVM tests to the VR package on purpose. The upstream project ships 167
          # other test classes that reference android.* framework types with neither Robolectric
          # nor unitTests.returnDefaultValues configured, and upstream CI never ran them. Running
          # all of them here would fail for reasons unrelated to this fork's changes.
          ./gradlew --no-daemon --no-configuration-cache \
            -Popennow.abis="$OPENNOW_ABIS" \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:testDebugUnitTest --tests "com.opencloudgaming.opennow.vr.*"

      # Guard against "CI is green but zero tests ran". Gradle writes one TEST-*.xml per
      # test class under app/build/test-results/testDebugUnitTest/. This step fails the job
      # unless at least one <testsuite> with tests > 0 exists and no failure/error is reported.
      - name: Assert VR JVM tests actually ran
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          files = sorted(glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'))
          suites = tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              # Gradle normally emits <testsuite> as the root; some versions wrap it in
              # <testsuites>. Iterating makes the assertion robust to both shapes.
              for suite in root.iter('testsuite'):
                  suites += 1
                  tests += int(suite.get('tests', 0))
                  failures += int(suite.get('failures', 0))
                  errors += int(suite.get('errors', 0))
                  skipped += int(suite.get('skipped', 0))
              print(' ', path)
          print('VR JVM test suites: %d | tests: %d | failures: %d | errors: %d | skipped: %d'
                % (suites, tests, failures, errors, skipped))
          if not files or suites == 0 or tests == 0:
              sys.exit('FAIL: no VR JVM tests executed - check the --tests filter and report path')
          if failures or errors:
              sys.exit('FAIL: VR JVM tests reported failures/errors')
          PY

      - name: Collect the debug and release APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../out
          # -print -quit avoids a `find | head` SIGPIPE under `set -o pipefail`.
          DEBUG_APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -name '*.apk' -type f ! -name '*unsigned*' -print -quit)"
          test -n "$DEBUG_APK" || { echo 'FAIL: no debug APK produced' >&2; exit 1; }
          test -n "$RELEASE_APK" || {
            echo 'FAIL: no SIGNED release APK produced (check signingConfigs.release)' >&2
            echo 'Release outputs:' >&2
            find app/build/outputs/apk/release -maxdepth 1 -type f -printf '%f\n' >&2 || true
            exit 1
          }
          cp -v "$DEBUG_APK" ../out/app-arm64-v8a-debug.apk
          cp -v "$RELEASE_APK" ../out/app-arm64-v8a-release.apk
          ls -la ../out

      # A green assembleRelease is not enough: an unsigned APK is un-installable, and an
      # accidentally-still-debuggable one is not an official build. Fail the job on either.
      - name: Verify the release APK is signed and not debuggable
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort | tail -1)"
          echo "apksigner: $APKSIGNER"
          test -n "$APKSIGNER" || { echo 'FAIL: apksigner not found' >&2; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs ../out/app-arm64-v8a-release.apk
          AAPT="$(find "$SDK/build-tools" -name aapt -type f | sort | tail -1 || true)"
          if [ -n "$AAPT" ]; then
            BADGING="$("$AAPT" dump badging ../out/app-arm64-v8a-release.apk)"
            echo "$BADGING" | grep -E '^package:'
            if echo "$BADGING" | grep -q 'application-debuggable'; then
              echo 'FAIL: release APK is still debuggable' >&2
              exit 1
            fi
            echo 'release APK is NOT debuggable'
          else
            echo 'aapt unavailable in this build-tools; skipping the debuggable flag check'
          fi

      # Same regression guard at the very end: verify BOTH shipped APKs really carry the JNI
      # bridge, not just the intermediate AAR. The release APK is the one users sideload.
      - name: Verify the Cardboard JNI bridge is in both APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, zipfile
          apks = sorted(glob.glob('../out/*.apk'))
          print('APKs:', apks)
          if not apks:
              sys.exit('FAIL: no APK produced')
          for path in apks:
              with zipfile.ZipFile(path) as z:
                  libs = sorted(n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so'))
              print(path, 'native libs:', libs)
              if 'lib/arm64-v8a/libcardboard_sdk_jni.so' not in libs:
                  sys.exit('FAIL: lib/arm64-v8a/libcardboard_sdk_jni.so missing from APK')
              if 'lib/arm64-v8a/libGfxPluginCardboard.so' not in libs:
                  sys.exit('FAIL: lib/arm64-v8a/libGfxPluginCardboard.so missing from APK')
          PY

      - name: Upload the official release APK
        uses: actions/upload-artifact@v4
        with:
          name: opennow-vr-release-arm64-v8a
          path: out/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload the debug APK (diagnostic fallback only)
        uses: actions/upload-artifact@v4
        with:
          name: opennow-vr-debug-arm64-v8a
          path: out/app-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload the unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vr-unit-test-report
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
