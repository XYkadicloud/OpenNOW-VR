name: android-build

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Single ABI to build (empty = both arm64-v8a and armeabi-v7a)'
        required: false
        default: ''
  push:
    branches:
      - android-native
      - main

permissions:
  contents: read

jobs:
  build:
    name: build-debug-apk-${{ matrix.abi }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ github.event.inputs.abi != '' && fromJSON(format('["{0}"]', github.event.inputs.abi)) || fromJSON('["arm64-v8a","armeabi-v7a"]') }}
    env:
      OPENNOW_ABIS: ${{ matrix.abi }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK at: $SDK"
          SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "platforms;android-37.1" "platforms;android-37.2" "build-tools;37.0.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
          echo "sdk.dir=$SDK" > local.properties

      - name: Build debug APK (single ABI)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export CMAKE="$SDK/cmake/3.31.6/bin/cmake"
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          echo "Using CMAKE=$CMAKE"
          echo "Packaging single ABI: $OPENNOW_ABIS"
          ./gradlew --no-daemon --no-configuration-cache -Popennow.abis="$OPENNOW_ABIS" assembleDebug

      - name: Collect APK
        run: |
          mkdir -p ../out
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} ../out/app-${{ matrix.abi }}-debug.apk \;
          ls -la ../out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennow-debug-${{ matrix.abi }}
          path: out/*.apk
          if-no-files-found: error
